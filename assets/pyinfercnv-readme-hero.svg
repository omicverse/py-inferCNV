    <text x="576" y="34" class="font" fill="#b9c1d7" font-size="17">Python</text>
    <text x="32" y="67" class="mono" font-size="25"><tspan fill="#d46bff">import</tspan><tspan fill="#f5f7ff"> pyinfercnv </tspan><tspan fill="#d46bff">as</tspan><tspan fill="#f5f7ff"> picnv</tspan></text>
    <text x="32" y="103" class="mono" font-size="25"><tspan fill="#3de3ff">picnv.tl.infer_cnv</tspan><tspan fill="#f5f7ff">(adata, ref=</tspan><tspan fill="#72ef9d">'normal'</tspan><tspan fill="#f5f7ff">)</tspan></text>
  </g>

