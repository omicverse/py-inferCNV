      <g opacity="0.95">
        <rect x="0" y="0" width="35" height="182" fill="#eef3ff"/><rect x="35" y="0" width="37" height="182" fill="#f9fbff"/><rect x="72" y="0" width="38" height="182" fill="#e6edff"/><rect x="110" y="0" width="38" height="182" fill="#fff7f7"/><rect x="148" y="0" width="38" height="182" fill="#f4f7ff"/><rect x="186" y="0" width="38" height="182" fill="#fffafa"/><rect x="224" y="0" width="38" height="182" fill="#eef3ff"/><rect x="262" y="0" width="38" height="182" fill="#fff4f4"/><rect x="300" y="0" width="38" height="182" fill="#f6f9ff"/><rect x="338" y="0" width="38" height="182" fill="#f4f6ff"/><rect x="376" y="0" width="38" height="182" fill="#fff1f1"/><rect x="414" y="0" width="38" height="182" fill="#edf3ff"/><rect x="452" y="0" width="38" height="182" fill="#fdfdff"/><rect x="490" y="0" width="30" height="182" fill="#f7f9ff"/>
        <rect x="0" y="183" width="35" height="287" fill="#1248e8" opacity="0.75"/><rect x="35" y="183" width="37" height="287" fill="#6f8cff" opacity="0.72"/><rect x="72" y="183" width="38" height="287" fill="#1d5cff" opacity="0.72"/><rect x="110" y="183" width="38" height="287" fill="#ff5b68" opacity="0.78"/><rect x="148" y="183" width="38" height="287" fill="#ffb0b0" opacity="0.72"/><rect x="186" y="183" width="38" height="287" fill="#1e57e7" opacity="0.8"/><rect x="224" y="183" width="38" height="287" fill="#315fff" opacity="0.75"/><rect x="262" y="183" width="38" height="287" fill="#ff494d" opacity="0.78"/><rect x="300" y="183" width="38" height="287" fill="#ffb2b2" opacity="0.7"/><rect x="338" y="183" width="38" height="287" fill="#e9efff"/><rect x="376" y="183" width="38" height="287" fill="#ff333d" opacity="0.82"/><rect x="414" y="183" width="38" height="287" fill="#0c42d8" opacity="0.78"/><rect x="452" y="183" width="38" height="287" fill="#ff777b" opacity="0.72"/><rect x="490" y="183" width="30" height="287" fill="#d70e20" opacity="0.82"/>
