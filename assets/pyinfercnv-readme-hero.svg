  <text x="245" y="213" class="font" font-size="94" font-weight="850" fill="#071152">py-inferCNV</text>
  <text x="245" y="292" class="font muted" font-size="39" font-weight="700">Python-first inferCNV-style analysis</text>
  <text x="245" y="342" class="font muted" font-size="39" font-weight="700">and visualization for <tspan fill="url(#titleGrad)">single-cell</tspan></text>
  <text x="245" y="392" class="font" font-size="43" font-weight="850" fill="url(#titleGrad)">CNV landscapes</text>

  <g class="font" font-size="19" font-weight="700">
    <g transform="translate(245,435)"><rect class="chip" width="185" height="54" rx="17"/><text x="21" y="34" fill="#4021b7">◉ reference-aware</text></g>
    <g transform="translate(448,435)"><rect class="chip" width="184" height="54" rx="17"/><text x="20" y="34" fill="#0862bc">▥ genome heatmap</text></g>
    <g transform="translate(650,435)"><rect class="chip" width="145" height="54" rx="17"/><text x="20" y="34" fill="#087c55">● single-cell</text></g>
    <g transform="translate(814,435)"><rect class="chip" width="107" height="54" rx="17"/><text x="20" y="34" fill="#c91635">DNA CNV</text></g>
    <g transform="translate(940,435)"><rect class="chip" width="112" height="54" rx="17"/><text x="20" y="34" fill="#b06a00">Python</text></g>
  </g>

