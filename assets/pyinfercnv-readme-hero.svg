<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">py-inferCNV README hero</title>
  <desc id="desc">Product-style README banner for py-inferCNV, a Python-first inferCNV-style single-cell CNV analysis and visualization package.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfdff"/>
      <stop offset="0.55" stop-color="#f5f8ff"/>
      <stop offset="1" stop-color="#eef3ff"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#111b6d"/>
      <stop offset="0.52" stop-color="#253ee8"/>
      <stop offset="1" stop-color="#8d45ff"/>
    </linearGradient>
    <linearGradient id="heat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0846d9"/>
      <stop offset="0.22" stop-color="#7fa4ff"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="0.76" stop-color="#ff9a9a"/>
      <stop offset="1" stop-color="#db101d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#31416f" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <style>
      .font{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
      .navy{fill:#101a52}.muted{fill:#43506f}.softText{fill:#66708f}
      .chip{fill:#ffffff;stroke:#dfe7fb;stroke-width:1.5}.thin{stroke:#d9e2f7;stroke-width:1.4}
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="120" cy="790" r="220" fill="#d8e8ff" opacity="0.45" filter="url(#soft)"/>
  <circle cx="1430" cy="120" r="210" fill="#eadfff" opacity="0.55" filter="url(#soft)"/>
  <circle cx="1110" cy="800" r="300" fill="#d7ecff" opacity="0.5" filter="url(#soft)"/>

