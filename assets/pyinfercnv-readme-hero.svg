    <polyline points="16,43 29,28 42,39 54,21" fill="none" stroke="#765dff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="16" cy="43" r="4" fill="#765dff"/><circle cx="29" cy="28" r="4" fill="#765dff"/><circle cx="42" cy="39" r="4" fill="#765dff"/><circle cx="54" cy="21" r="4" fill="#765dff"/>
  </g>
  <text x="360" y="603" class="font navy" font-size="27">Explore chromosome-scale copy number</text>
  <text x="360" y="641" class="font navy" font-size="27">signals with clean, publication-style visuals.</text>

  <g transform="translate(170,690)" filter="url(#shadow)">
    <rect width="650" height="112" rx="18" fill="#0a1428"/>
    <circle cx="28" cy="24" r="8" fill="#ff5f67"/><circle cx="52" cy="24" r="8" fill="#ffcc37"/><circle cx="76" cy="24" r="8" fill="#2fd86b"/>
