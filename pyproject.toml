[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyinfercnv"
version = "0.2.0"
description = "A pure-Python re-implementation of inferCNV (Broad Institute) — single-cell CNV inference from scRNA-seq, AnnData-native, R-parity-audited."
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.10,<3.13"
authors = [{ name = "Jason", email = "lucyagune3@gmail.com" }]
keywords = [
  "single-cell",
  "scRNA-seq",
  "copy-number",
  "CNV",
  "tumor",
  "infercnv",
  "bioinformatics",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.11",
  "pandas>=2.0",
  "pyarrow>=14.0",
  "anndata>=0.10",
  "scanpy>=1.10",
  "scikit-learn>=1.3",
  "igraph>=0.11",
  "numba>=0.59",
  "tqdm>=4.65",
  "typer>=0.12",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]
compare = ["hmmlearn>=0.3"]
leiden = ["leidenalg>=0.10", "igraph>=0.11"]
dev = [
  "pytest>=7.4",
  "pytest-xdist>=3.5",
  "ruff>=0.5",
  "build>=1.0",
  "twine>=5.0",
  "psutil>=5.9",
  "threadpoolctl>=3.2",
  "pyreadr>=0.5",
]
docs = ["sphinx>=7.0", "myst-parser", "sphinx-book-theme"]

[project.scripts]
pyinfercnv = "pyinfercnv.cli:app"

[project.urls]
Homepage = "https://github.com/omicverse/py-inferCNV"
Repository = "https://github.com/omicverse/py-inferCNV"
Issues = "https://github.com/omicverse/py-inferCNV/issues"

[tool.hatch.build.targets.wheel]
packages = ["pyinfercnv"]
# NOTE: gene-position parquets (data/hg38, hg19, mm10) auto-included from
# pyinfercnv/data/ once generated by scripts/generate_gene_positions.py at Task 10.
# Re-introduce force-include here only if hatchling auto-include misses them.

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP"]
ignore = ["N803", "N806"]

[tool.pytest.ini_options]
minversion = "7.4"
addopts = "-ra -q --strict-markers"
markers = [
  "slow: slow tests requiring R or full benchmark data",
  "r_parity: tests depending on tests/r_out/ TSVs",
]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "igraph>=1.0.0",
    "ipykernel>=7.2.0",
    "leidenalg>=0.11.0",
    "nbclient>=0.10.4",
    "nbformat>=5.10.4",
]
