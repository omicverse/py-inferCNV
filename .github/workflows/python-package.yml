name: python-package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync project (dev extras)
        run: uv sync --extra dev --group dev

      - name: Unit and integration tests
        run: uv run pytest

  build:
    name: build wheel + twine check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync project (dev extras)
        run: uv sync --extra dev --group dev

      - name: Build sdist + wheel
        run: uv run python -m build

      - name: Twine check
        run: uv run twine check dist/*

      - name: Assert pure-Python wheel
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheels = glob.glob("dist/*.whl")
          assert len(wheels) == 1, wheels
          wheel = wheels[0]
          assert wheel.endswith("-py3-none-any.whl"), f"non-universal wheel: {wheel}"
          with zipfile.ZipFile(wheel) as zf:
              bad = [
                  name
                  for name in zf.namelist()
                  if name.endswith((".so", ".pyd", ".dylib"))
              ]
          assert not bad, f"binary extensions found in wheel: {bad}"
          print(f"OK pure-Python wheel: {wheel}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/*
          if-no-files-found: error

  lint:
    # Informational only until the existing Ruff baseline is cleaned up.
    name: ruff (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync project (dev extras)
        run: uv sync --extra dev --group dev

      - name: ruff check
        run: uv run ruff check pyinfercnv tests
